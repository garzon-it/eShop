receivers:
  hostmetrics:
    collection_interval: 500ms
    scrapers:
      cpu:
      memory:
      disk:
      network:
      load:
      filesystem:

  filelog:
    include:
      - ${env:GITHUB_WORKSPACE}/artifacts/step-logs/**/*.log
    start_at: beginning
    poll_interval: 200ms
    operators:
      # Each line starts with: [ci.step=<name>]
      - type: regex_parser
        regex: '^\[ci\.step=(?P<ci_step>[^\]]+)\]\s*(?P<log_body>.*)$'
        parse_from: body
        on_error: drop

      # Replace raw body with the actual log content (without the prefix)
      - type: move
        from: attributes.log_body
        to: body

      # avoid nested kvlist
      - type: move
        from: attributes.ci_step
        to: attributes["ci.step.name"]

  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  resource:
    attributes:
      - key: ci.provider
        value: "github_actions"
        action: upsert
      - key: ci.run.id
        value: ${env:GITHUB_RUN_ID}
        action: upsert
      - key: ci.run.number
        value: ${env:GITHUB_RUN_NUMBER}
        action: upsert
      - key: ci.workflow
        value: ${env:GITHUB_WORKFLOW}
        action: upsert
      - key: ci.job
        value: ${env:GITHUB_JOB}
        action: upsert
      - key: vcs.commit.sha
        value: ${env:GITHUB_SHA}
        action: upsert
      - key: vcs.ref
        value: ${env:GITHUB_REF}
        action: upsert
      - key: vcs.repository
        value: ${env:GITHUB_REPOSITORY}
        action: upsert
      - key: ci.runner.name
        value: ${env:RUNNER_NAME}
        action: upsert
      - key: ci.runner.os
        value: ${env:RUNNER_OS}
        action: upsert
      - key: ci.runner.environment
        value: ${env:RUNNER_ENVIRONMENT}
        action: upsert

  batch: {}

exporters:
  file:
    path: ${env:GITHUB_WORKSPACE}/artifacts/otel/otel-logs.json
    rotation:
      max_megabytes: 50
      max_backups: 2

  file/metrics:
    path: ${env:GITHUB_WORKSPACE}/artifacts/otel/otel-metrics.json
    rotation:
      max_megabytes: 50
      max_backups: 2

  file/traces:
    path: ${env:GITHUB_WORKSPACE}/artifacts/otel/otel-traces.json
    rotation:
      max_megabytes: 50
      max_backups: 2

  otlphttp/grafana:
    endpoint: "https://otlp-gateway-prod-eu-west-2.grafana.net/otlp"
    headers:
      Authorization: "Basic MTUyMDk0NjpnbGNfZXlKdklqb2lNVFkyTkRJM05TSXNJbTRpT2lKamFTMTBaWE4wSWl3aWF5STZJak55YnpWUVJHUjBOVFJETVcxUlp6ZFJNRWsxYVRKek5TSXNJbTBpT25zaWNpSTZJbkJ5YjJRdFpYVXRkMlZ6ZEMweUluMTk="


service:
  pipelines:
    logs:
      receivers: [filelog]
      processors: [resource, batch]
      exporters: [file, otlphttp/grafana]

    metrics:
      receivers: [hostmetrics]
      processors: [resource, batch]
      exporters: [file/metrics, otlphttp/grafana]

    traces:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [file/traces, otlphttp/grafana]
