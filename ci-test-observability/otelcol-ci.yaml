receivers:
  hostmetrics:
    collection_interval: 1s
    scrapers:
      cpu:
        metrics:
          system.cpu.utilization:
            enabled: true
          system.cpu.logical.count:
            enabled: true
      memory:
      disk:
      network:
      load:
      filesystem:

  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  resource:
    attributes:
      - key: service.name
        value: "ci-observability"
        action: upsert
      - key: "cicd.provider.name" # ! not in OTEL semantic convention
        value: "github_actions" # TODO this is a hardcoded value. Update for each ci/cd system
        action: upsert
      - key: cicd.pipeline.run.id
        value: ${env:GITHUB_RUN_ID}
        action: upsert
      - key: cicd.pipeline.run.attempt # ! not in OTEL semantic convention
        value: ${env:GITHUB_RUN_NUMBER}
        action: upsert
      - key: cicd.pipeline.name
        value: ${env:GITHUB_WORKFLOW}
        action: upsert
      - key: cicd.job.name
        value: ${env:GITHUB_JOB}
        action: upsert
      - key: vcs.ref.head.revision
        value: ${env:GITHUB_SHA}
        action: upsert
      - key: vcs.ref.head.name
        value: ${env:GITHUB_REF_NAME}
        action: upsert
      - key: vcs.ref.head.type
        value: ${env:GITHUB_REF_TYPE}
        action: upsert
      - key: vcs.repository.name
        value: ${env:GITHUB_REPOSITORY}
        action: upsert
      - key: cicd.worker.name
        value: ${env:RUNNER_NAME}
        action: upsert
      - key: os.name
        value: ${env:RUNNER_OS}
        action: upsert
      - key: cicd.worker.type # ! not in OTEL semantic convention
        value: ${env:RUNNER_ENVIRONMENT}
        action: upsert

  batch: {}

exporters:
  file:
    path: ${env:GITHUB_WORKSPACE}/artifacts/otel/otel-logs.json
    rotation:
      max_megabytes: 50
      max_backups: 2

  file/metrics:
    path: ${env:GITHUB_WORKSPACE}/artifacts/otel/otel-metrics.json
    rotation:
      max_megabytes: 50
      max_backups: 2

  file/traces:
    path: ${env:GITHUB_WORKSPACE}/artifacts/otel/otel-traces.json
    rotation:
      max_megabytes: 50
      max_backups: 2

  otlphttp/grafana:
    # endpoint: "https://otlp-gateway-prod-eu-west-2.grafana.net/otlp"
    endpoint: "https://ci-otlp.garzon-it.com"
    headers:
      # Authorization: "Basic MTUyMDk0NjpnbGNfZXlKdklqb2lNVFkyTkRJM05TSXNJbTRpT2lKamFTMTBaWE4wSWl3aWF5STZJak55YnpWUVJHUjBOVFJETVcxUlp6ZFJNRWsxYVRKek5TSXNJbTBpT25zaWNpSTZJbkJ5YjJRdFpYVXRkMlZ6ZEMweUluMTk="
      Authorization: "Basic Y2l1c2VyOm1lc2l0YXNjb2xvbWJpYTEyMzQ="


service:
  pipelines:
    logs:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [file, otlphttp/grafana]

    metrics:
      receivers: [hostmetrics]
      processors: [resource, batch]
      exporters: [file/metrics, otlphttp/grafana]

    traces:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [file/traces, otlphttp/grafana]
