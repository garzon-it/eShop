receivers:
  hostmetrics:
    collection_interval: 5s
    scrapers:
      cpu:
        metrics:
          system.cpu.utilization:
            enabled: true
          system.cpu.time:
            enabled: true
          system.cpu.logical.count:
            enabled: false
      memory:
        metrics:
          system.memory.usage:
            enabled: true
          system.memory.utilization:
            enabled: false
      load:
        metrics:
          system.cpu.load_average.1m:
            enabled: false
          system.cpu.load_average.5m:
            enabled: false

  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:

  # LOW-CARDINALITY (ALL SIGNALS)
  resource_common:
    attributes:
      - key: service.name
        value: ${env:CI_SERVICE_NAME}
        action: upsert
      - key: service.instance.id
        value: ${env:CI_INSTANCE_ID}
        action: upsert
      - key: cicd.provider.name
        value: "github_actions"
        action: upsert
      - key: cicd.pipeline.name
        value: ${env:GITHUB_WORKFLOW}
        action: upsert
      - key: cicd.job.name
        value: ${env:GITHUB_JOB}
        action: upsert
      - key: cicd.job.target
        value: ${env:CI_JOB_TARGET}
        action: upsert
      - key: cicd.worker.type
        value: ${env:RUNNER_ENVIRONMENT}
        action: upsert
      - key: host.name
        value: ${env:RUNNER_NAME}
        action: upsert
      - key: os.name
        value: ${env:RUNNER_OS}
        action: upsert
      - key: host.arch
        value: ${env:RUNNER_ARCH}
        action: upsert

  # HIGH-CARDINALITY (TRACES + LOGS ONLY)
  resource_run_context:
    attributes:
      - key: cicd.pipeline.run.id
        value: ${env:GITHUB_RUN_ID}
        action: upsert
      - key: cicd.pipeline.run.url
        value: ${env:CI_PIPELINE_RUN_URL}
        action: upsert
      - key: cicd.pipeline.run.attempt
        value: ${env:GITHUB_RUN_ATTEMPT}
        action: upsert
      - key: vcs.ref.head.revision
        value: ${env:GITHUB_SHA}
        action: upsert
      - key: vcs.ref.head.name
        value: ${env:GITHUB_REF_NAME}
        action: upsert
      - key: vcs.ref.head.type
        value: ${env:GITHUB_REF_TYPE}
        action: upsert
      - key: vcs.repository.name
        value: ${env:GITHUB_REPOSITORY}
        action: upsert

  batch: {}

exporters:
  file:
    path: ${env:GITHUB_WORKSPACE}/artifacts/otel/otel-logs.json
    rotation:
      max_megabytes: 50
      max_backups: 2

  file/metrics:
    path: ${env:GITHUB_WORKSPACE}/artifacts/otel/otel-metrics.json
    rotation:
      max_megabytes: 50
      max_backups: 2

  file/traces:
    path: ${env:GITHUB_WORKSPACE}/artifacts/otel/otel-traces.json
    rotation:
      max_megabytes: 50
      max_backups: 2

  otlphttp/grafana:
    endpoint: "https://ci-otlp.garzon-it.com"
    headers:
      Authorization: ${env:OTLP_AUTH_HEADER}

service:
  pipelines:

    # LOGS
    logs:
      receivers: [otlp]
      processors: [resource_common, resource_run_context, batch]
      exporters: [file, otlphttp/grafana]

    # METRICS
    metrics:
      receivers: [hostmetrics]
      processors: [resource_common, batch]
      exporters: [file/metrics, otlphttp/grafana]

    # TRACES
    traces:
      receivers: [otlp]
      processors: [resource_common, resource_run_context, batch]
      exporters: [file/traces, otlphttp/grafana]