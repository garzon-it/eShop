receivers:
  filelog:
    include:
      - ${env:GITHUB_WORKSPACE}/artifacts/step-logs/**/*.log
    start_at: beginning
    poll_interval: 200ms
    operators:
      # Each line starts with: [ci.step=<name>]
      - type: regex_parser
        regex: '^\[ci\.step=(?P<ci_step>[^\]]+)\]\s*(?P<log_body>.*)$'
        parse_from: body
        on_error: drop

      # Replace raw body with the actual log content (without the prefix)
      - type: move
        from: attributes.log_body
        to: body

      # avoid nested kvlist
      - type: move
        from: attributes.ci_step
        to: attributes["ci.step.name"]

processors:
  resource:
    attributes:
      - key: ci.provider
        value: "github_actions"
        action: upsert
      - key: ci.run.id
        value: ${env:GITHUB_RUN_ID}
        action: upsert
      - key: ci.run.number
        value: ${env:GITHUB_RUN_NUMBER}
        action: upsert
      - key: ci.workflow
        value: ${env:GITHUB_WORKFLOW}
        action: upsert
      - key: ci.job
        value: ${env:GITHUB_JOB}
        action: upsert
      - key: vcs.commit.sha
        value: ${env:GITHUB_SHA}
        action: upsert
      - key: vcs.ref
        value: ${env:GITHUB_REF}
        action: upsert
      - key: vcs.repository
        value: ${env:GITHUB_REPOSITORY}
        action: upsert

  batch: {}

exporters:
  file:
    path: ${env:GITHUB_WORKSPACE}/artifacts/otel/otel-logs.json
    rotation:
      max_megabytes: 50
      max_backups: 2

service:
  pipelines:
    logs:
      receivers: [filelog]
      processors: [resource, batch]
      exporters: [file]
