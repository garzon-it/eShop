receivers:
  filelog:
    include:
      - ${env:GITHUB_WORKSPACE}/artifacts/step-logs/**/*.log
    start_at: beginning
    operators:
      # Each line starts with: [ci.step=<name>]
      - type: regex_parser
        regex: '^\[ci\.step=(?P<ci_step>[^\]]+)\]\s(?P<body>.*)$'
        parse_from: body
        on_error: drop

      - type: move
        from: attributes.ci_step
        to: attributes.ci.step.name

processors:
  batch: {}

exporters:
  file:
    path: ${env:GITHUB_WORKSPACE}/artifacts/otel/otel-logs.json
    rotation:
      max_megabytes: 50
      max_backups: 2

service:
  pipelines:
    logs:
      receivers: [filelog]
      processors: [batch]
      exporters: [file]
