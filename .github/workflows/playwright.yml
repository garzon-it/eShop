name: Playwright Tests for eShop
on:
  push:
    branches: [ continuous_testing ]
    paths-ignore:
      - '**.md'
      - 'src/ClientApp/**'
      - 'tests/ClientApp.UnitTests/**'
      - '.github/workflows/pr-validation-maui.yml'
  pull_request:
    branches: [ continuous_testing ]
    paths-ignore:
      - '**.md'
      - 'src/ClientApp/**'
      - 'test/ClientApp.UnitTests/**'
      - '.github/workflows/pr-validation-maui.yml'

jobs:
  e2e-test:
    timeout-minutes: 60
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        runner: [self-hosted, ubuntu-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        global-json-file: global.json
      env:
        DOTNET_INSTALL_DIR: ${{ runner.temp }}/.dotnet

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: lts/*

    - name: Setup Python (for Pipeline Monitor)
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Add .NET to PATH
      run: |
        echo "${{ runner.temp }}/.dotnet" >> $GITHUB_PATH
        echo "${{ runner.temp }}/.dotnet/tools" >> $GITHUB_PATH
        echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

    - name: Install Pipeline Monitor
      run: |
        curl -fsSL https://raw.githubusercontent.com/garzon-it/microservices-testing-dashboard/monitoring/monitoring/install.sh | bash

    - name: Install .NET HTTPS Development Certificate
      run: |
        dotnet tool update -g linux-dev-certs
        export PATH="$PATH:$HOME/.dotnet/tools"
        dotnet linux-dev-certs install || true

    - name: Install system dependencies for Playwright
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libatk1.0-0 \
          libatk-bridge2.0-0 \
          libcups2 \
          libatspi2.0-0 \
          libxcomposite1 \
          libxdamage1 \
          libxfixes3 \
          libxrandr2 \
          libgbm1 \
          libxkbcommon0 \
          libpango-1.0-0 \
          libcairo2 \
          libasound2t64

    - name: Debug curl server
      run: |
        echo "Testing with curl..."
        curl -vk https://localhost:19888/ || true

    - name: Run workload with monitoring (npm + browsers + tests)
      env:
        PIPELINE_COMPONENT: eShop
        PIPELINE_STAGE: e2e

        MONITOR_DEBUG: "1"

        ESHOP_USE_HTTP_ENDPOINTS: 1
        USERNAME1: bob
        PASSWORD: Pass123$
        DEBUG: pw:webserver*
      run: |
        set -euo pipefail
        mkdir -p artifacts/monitoring

        python3 ~/pipeline-monitor/ci_context_github.py \
          --output artifacts/monitoring/run_context.json

        export RUN_CONTEXT_PATH="artifacts/monitoring/run_context.json"

        cat > run_all.sh <<'SH'
        #!/usr/bin/env bash
        set -euo pipefail
        echo "==== Phase 1: npm ci ===="
        npm ci
        echo "==== Phase 2: install Playwright browsers ===="
        npx playwright install chromium
        echo "==== Phase 3: run Playwright tests ===="
        npx playwright test
        SH
        chmod +x run_all.sh

        export LOG_PATH="artifacts/monitoring/monitor-${{ matrix.runner }}.log"
        export JSON_OUTPUT="artifacts/monitoring/monitor_metrics-${{ matrix.runner }}.json"
        export INTERVAL="1"

        ~/pipeline-monitor/run_with_monitoring.sh "./run_all.sh"

        python3 ~/pipeline-monitor/build_run_record.py \
          --context artifacts/monitoring/run_context.json \
          --monitor "artifacts/monitoring/monitor_metrics-${{ matrix.runner }}.json" \
          --output "artifacts/monitoring/run_record-${{ matrix.runner }}.json"

    - name: Upload monitoring artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: pipeline-monitor-${{ matrix.runner }}
        path: artifacts/monitoring/

  durations:
    name: Fetch job durations
    runs-on: ubuntu-latest
    needs: e2e-test
    if: always()
    permissions:
      actions: read
      contents: read

    steps:
      - name: Fetch jobs and write durations
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" \
          | python3 -c '
          import sys, json, datetime

          def parse_iso(s):
              if not s:
                  return None
              return datetime.datetime.fromisoformat(s.replace("Z", "+00:00"))

          data = json.load(sys.stdin)

          jobs_out = []
          for j in data.get("jobs", []):
              started = parse_iso(j.get("started_at"))
              completed = parse_iso(j.get("completed_at"))
              dur = (completed - started).total_seconds() if started and completed else None
              jobs_out.append({
                  "job_name": j.get("name"),
                  "conclusion": j.get("conclusion"),
                  "started_at": j.get("started_at"),
                  "completed_at": j.get("completed_at"),
                  "duration_seconds": dur,
              })

          out = {"jobs": jobs_out}

          with open("job_durations.json", "w", encoding="utf-8") as f:
              json.dump(out, f, indent=2)

          for row in jobs_out:
              d = row.get("duration_seconds")
              name = row.get("job_name")
              if d is None:
                  print("{}: duration unavailable".format(name))
              else:
                  print("{}: {:.1f}s".format(name, d))
          '

      - name: Upload durations artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: job-durations
          path: job_durations.json
