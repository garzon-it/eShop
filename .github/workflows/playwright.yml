name: Playwright Tests for eShop
on:
  push:
    branches: [ continuous_testing ]
    paths-ignore:
      - '**.md'
      - 'src/ClientApp/**'
      - 'tests/ClientApp.UnitTests/**'
      - '.github/workflows/pr-validation-maui.yml'
  pull_request:
    branches: [ continuous_testing ]
    paths-ignore:
      - '**.md'
      - 'src/ClientApp/**'
      - 'test/ClientApp.UnitTests/**'
      - '.github/workflows/pr-validation-maui.yml'

jobs:
  test:
    timeout-minutes: 60
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        runner: [self-hosted, ubuntu-latest]  # Change to [ubuntu-latest] as needed

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        global-json-file: global.json
      env:
        DOTNET_INSTALL_DIR: ${{ runner.temp }}/.dotnet

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: lts/*

    - name: Setup Python (for Pipeline Monitor)
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Add .NET to PATH
      run: |
        echo "${{ runner.temp }}/.dotnet" >> $GITHUB_PATH
        echo "${{ runner.temp }}/.dotnet/tools" >> $GITHUB_PATH
        echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

    - name: Install Pipeline Monitor
      run: |
        curl -fsSL https://raw.githubusercontent.com/garzon-it/microservices-testing-dashboard/monitoring/monitoring/install.sh | bash

    - name: Install .NET HTTPS Development Certificate
      run: |
        dotnet tool update -g linux-dev-certs
        export PATH="$PATH:$HOME/.dotnet/tools"
        dotnet linux-dev-certs install || true

    - name: Install system dependencies for Playwright
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libatk1.0-0 \
          libatk-bridge2.0-0 \
          libcups2 \
          libatspi2.0-0 \
          libxcomposite1 \
          libxdamage1 \
          libxfixes3 \
          libxrandr2 \
          libgbm1 \
          libxkbcommon0 \
          libpango-1.0-0 \
          libcairo2 \
          libasound2t64

    - name: Debug curl server
      run: |
        echo "Testing with curl..."
        curl -vk https://localhost:19888/ || true

    - name: Run whole pipeline workload with monitoring (npm + browsers + tests) 
      run: |
        set -euo pipefail
        mkdir -p artifacts/monitoring

        cat > run_all.sh <<'SH'
        #!/usr/bin/env bash
        set -euo pipefail
        echo "==== Phase 1: npm ci ===="
        npm ci
        echo "==== Phase 2: install Playwright browsers ===="
        npx playwright install chromium
        echo "==== Phase 3: run Playwright tests ===="
        npx playwright test
        SH

        chmod +x run_all.sh

        export LOG_PATH="artifacts/monitoring/monitor-internal-${{ matrix.runner }}.log"
        export JSON_OUTPUT="artifacts/monitoring/metrics-${{ matrix.runner }}.json"
        stdbuf -oL -eL ~/pipeline-monitor/run_with_monitoring.sh "./run_all.sh" \
          | tee "artifacts/monitoring/pipeline-monitor-${{ matrix.runner }}.log"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        ESHOP_USE_HTTP_ENDPOINTS: 1
        USERNAME1: bob
        PASSWORD: Pass123$
        DEBUG: pw:webserver*

    - name: Upload monitoring logs
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: pipeline-monitor-${{ matrix.runner }}
        path: artifacts/monitoring/
