name: Playwright Tests for eShop
on:
  push:
    branches: [ otel_test ]
    paths-ignore:
      - '**.md'
      - 'src/ClientApp/**'
      - 'tests/ClientApp.UnitTests/**'
      - '.github/workflows/pr-validation-maui.yml'
  pull_request:
    branches: [ otel_test ]
    paths-ignore:
      - '**.md'
      - 'src/ClientApp/**'
      - 'test/ClientApp.UnitTests/**'
      - '.github/workflows/pr-validation-maui.yml'
jobs:
  test:
    timeout-minutes: 60
    runs-on: ${{ matrix.runner }}
    env:
      CI_SERVICE_NAME: "cicd-pipeline"
      CI_JOB_TARGET: "eshop-e2e"
      OTLP_AUTH_HEADER: ${{ secrets.OTLP_AUTH_HEADER }}
    strategy:
      matrix:
        runner: [
          self-hosted, 
          ubuntu-latest
        ]
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-dotnet@v4
      with:
        global-json-file: global.json
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*

    - name: Setup Python (for ciwrap)
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: ci-test-observability/requirements.txt

    - name: Install Python OTel dependencies
      run: pip install -r ci-test-observability/requirements.txt

    # OTel: prepare folders + collector binary + start collector
    - name: Prepare OTel
      run: |
        set -euo pipefail
        mkdir -p artifacts/step-logs artifacts/otel

        # Download otelcol-contrib (Linux).
        OTEL_VERSION="0.99.0"
        curl -fsSL -o otelcol-contrib.tgz \
          "https://github.com/open-telemetry/opentelemetry-collector-releases/releases/download/v${OTEL_VERSION}/otelcol-contrib_${OTEL_VERSION}_linux_amd64.tar.gz"
        tar -xzf otelcol-contrib.tgz otelcol-contrib
        chmod +x otelcol-contrib

    - name: Bootstrap CI context
      run: bash ci-test-observability/setup_ci_context.sh

    - name: Start OTel Collector
      run: |
        set -euo pipefail
        mkdir -p artifacts/otel
        ./otelcol-contrib --config ci-test-observability/otelcol-ci.yaml \
          > artifacts/otel/otelcol-${{ matrix.runner }}.log 2>&1 &
        echo $! > artifacts/otel/otelcol-${{ matrix.runner }}.pid

    - name: Initialize trace context
      run: python3 ci-test-observability/ciwrap.py --init-trace

    - name: Install dependencies
      run: python3 ci-test-observability/ciwrap.py --name "Install dependencies" --process-metrics --process-include-children -- npm ci

    - name: Install .NET HTTPS Development Certificate
      run: |
        python3 ci-test-observability/ciwrap.py --name "Install .NET HTTPS Dev Certs - tool update" -- dotnet tool update -g linux-dev-certs
        python3 ci-test-observability/ciwrap.py --name "Install .NET HTTPS Dev Certs - install" -- dotnet linux-dev-certs install

    - name: Install Playwright Browsers
      run: python3 ci-test-observability/ciwrap.py --name "Install Playwright Browsers" --process-metrics -- npx playwright install chromium

    - name: Run Playwright tests
      run: python3 ci-test-observability/ciwrap.py --name "Run Playwright tests" --process-metrics --process-include-children --junit artifacts/test-results/results.xml -- npx playwright test
      env:
        ESHOP_USE_HTTP_ENDPOINTS: 1
        USERNAME1: bob
        PASSWORD: Pass123$

    - name: Finish trace (export job span)
      if: always()
      run: python3 ci-test-observability/ciwrap.py --finish-trace

    - name: Stop OTel Collector (graceful shutdown flushes pending data)
      if: always()
      run: |
        set +e
        pidfile="artifacts/otel/otelcol-${{ matrix.runner }}.pid"
        [ -f "$pidfile" ] || exit 0
        pid=$(cat "$pidfile")
        kill "$pid" 2>/dev/null
        timeout 12 tail --pid="$pid" -f /dev/null 2>/dev/null

    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report-${{ matrix.runner }}
        path: playwright-report/
        retention-days: 30

    # OTel OTLP-JSON (logs + metrics) + raw captured logs
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: otel-data-${{ matrix.runner }}
        path: |
          artifacts/otel/otel-logs.json
          artifacts/otel/otel-metrics.json
          artifacts/otel/otel-traces.json
          artifacts/step-logs/
          artifacts/otel/otelcol-${{ matrix.runner }}.log
          artifacts/test-results/
        retention-days: 30
