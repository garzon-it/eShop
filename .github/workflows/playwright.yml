name: Playwright Tests for eShop
on:
  push:
    branches: [ continuous_testing ]
    paths-ignore:
      - '**.md'
      - 'src/ClientApp/**'
      - 'tests/ClientApp.UnitTests/**'
      - '.github/workflows/pr-validation-maui.yml'
  pull_request:
    branches: [ continuous_testing ]
    paths-ignore:
      - '**.md'
      - 'src/ClientApp/**'
      - 'test/ClientApp.UnitTests/**'
      - '.github/workflows/pr-validation-maui.yml'

jobs:
  test:
    timeout-minutes: 60
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        runner: [self-hosted, ubuntu-latest]  # Change to [ubuntu-latest] as needed

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        global-json-file: global.json
      env:
        DOTNET_INSTALL_DIR: ${{ runner.temp }}/.dotnet

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: lts/*

    - name: Setup Python (for Pipeline Monitor)
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Add .NET to PATH
      run: |
        echo "${{ runner.temp }}/.dotnet" >> $GITHUB_PATH
        echo "${{ runner.temp }}/.dotnet/tools" >> $GITHUB_PATH
        echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

    - name: Install Pipeline Monitor
      run: |
        curl -fsSL https://raw.githubusercontent.com/garzon-it/microservices-testing-dashboard/monitoring/monitoring/install.sh | bash

    - name: Install .NET HTTPS Development Certificate
      run: |
        dotnet tool update -g linux-dev-certs
        export PATH="$PATH:$HOME/.dotnet/tools"
        dotnet linux-dev-certs install || true

    - name: Install system dependencies for Playwright
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libatk1.0-0 \
          libatk-bridge2.0-0 \
          libcups2 \
          libatspi2.0-0 \
          libxcomposite1 \
          libxdamage1 \
          libxfixes3 \
          libxrandr2 \
          libgbm1 \
          libxkbcommon0 \
          libpango-1.0-0 \
          libcairo2 \
          libasound2t64

    - name: Debug curl server
      run: |
        echo "Testing with curl..."
        curl -vk https://localhost:19888/ || true

    - name: Run whole pipeline workload with monitoring (npm + browsers + tests) 
      run: |
        set -euo pipefail
        mkdir -p artifacts/monitoring

        cat > run_all.sh <<'SH'
        #!/usr/bin/env bash
        set -euo pipefail
        echo "==== Phase 1: npm ci ===="
        npm ci
        echo "==== Phase 2: install Playwright browsers ===="
        npx playwright install chromium
        echo "==== Phase 3: run Playwright tests ===="
        npx playwright test
        SH

        chmod +x run_all.sh

        export LOG_PATH="artifacts/monitoring/monitor-internal-${{ matrix.runner }}.log"
        export JSON_OUTPUT="artifacts/monitoring/metrics-${{ matrix.runner }}.json"
        stdbuf -oL -eL ~/pipeline-monitor/run_with_monitoring.sh "./run_all.sh" \
          | tee "artifacts/monitoring/pipeline-monitor-${{ matrix.runner }}.log"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        ESHOP_USE_HTTP_ENDPOINTS: 1
        USERNAME1: bob
        PASSWORD: Pass123$
        DEBUG: pw:webserver*

    - name: Upload monitoring logs
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: pipeline-monitor-${{ matrix.runner }}
        path: artifacts/monitoring/
  durations:
    name: Fetch final job durations (post-job)
    runs-on: ubuntu-latest
    needs: test
    if: always()
    permissions:
      actions: read
      contents: read

    steps:
      - name: Fetch jobs for this run and compute durations
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          # Fetch all jobs for this workflow run (includes matrix-expanded job names)
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" \
            > jobs.json

          python3 - <<'PY'
          import json, datetime

          def parse_iso(s):
              # GitHub returns ISO8601 like 2026-01-21T16:29:24Z
              if not s:
                  return None
              return datetime.datetime.fromisoformat(s.replace("Z", "+00:00"))

          with open("jobs.json","r",encoding="utf-8") as f:
              data = json.load(f)

          out = []
          for j in data.get("jobs", []):
              started = parse_iso(j.get("started_at"))
              completed = parse_iso(j.get("completed_at"))
              dur = (completed - started).total_seconds() if started and completed else None
              out.append({
                  "id": j.get("id"),
                  "name": j.get("name"),
                  "status": j.get("status"),
                  "conclusion": j.get("conclusion"),
                  "runner_name": j.get("runner_name"),
                  "started_at": j.get("started_at"),
                  "completed_at": j.get("completed_at"),
                  "duration_seconds": dur,
              })

          with open("final_job_durations.json","w",encoding="utf-8") as f:
              json.dump(
                  {"run_jobs": out},
                  f,
                  indent=2
              )

          # Print a readable summary
          for row in out:
              if row["duration_seconds"] is not None:
                  print(f'{row["name"]}: {row["duration_seconds"]:.1f}s')
              else:
                  print(f'{row["name"]}: duration unavailable (started_at/completed_at missing)')
          PY

      - name: Upload final durations artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-job-durations
          path: |
            jobs.json
            final_job_durations.json
