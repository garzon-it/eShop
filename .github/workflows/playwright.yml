name: Playwright Tests for eShop
on:
  push:
    branches: [ continuous_testing ]
    paths-ignore:
      - '**.md'
      - 'src/ClientApp/**'
      - 'tests/ClientApp.UnitTests/**'
      - '.github/workflows/pr-validation-maui.yml'
  pull_request:
    branches: [ continuous_testing ]
    paths-ignore:
      - '**.md'
      - 'src/ClientApp/**'
      - 'test/ClientApp.UnitTests/**'
      - '.github/workflows/pr-validation-maui.yml'

jobs:
  e2e-test:
    timeout-minutes: 60
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        runner: [self-hosted, ubuntu-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        global-json-file: global.json
      env:
        DOTNET_INSTALL_DIR: ${{ runner.temp }}/.dotnet

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: lts/*

    - name: Setup Python (for Pipeline Monitor)
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Add .NET to PATH
      run: |
        echo "${{ runner.temp }}/.dotnet" >> $GITHUB_PATH
        echo "${{ runner.temp }}/.dotnet/tools" >> $GITHUB_PATH
        echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

    - name: Install Pipeline Monitor
      run: |
        curl -fsSL https://raw.githubusercontent.com/garzon-it/microservices-testing-dashboard/monitoring/monitoring/install.sh | bash

    - name: Install .NET HTTPS Development Certificate
      run: |
        dotnet tool update -g linux-dev-certs
        export PATH="$PATH:$HOME/.dotnet/tools"
        dotnet linux-dev-certs install || true

    - name: Install system dependencies for Playwright
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libatk1.0-0 \
          libatk-bridge2.0-0 \
          libcups2 \
          libatspi2.0-0 \
          libxcomposite1 \
          libxdamage1 \
          libxfixes3 \
          libxrandr2 \
          libgbm1 \
          libxkbcommon0 \
          libpango-1.0-0 \
          libcairo2 \
          libasound2t64

    - name: Debug curl server
      run: |
        echo "Testing with curl..."
        curl -vk https://localhost:19888/ || true

    - name: Run workload with monitoring (npm + browsers + tests)
      env:
        PIPELINE_COMPONENT: eShop
        PIPELINE_STAGE: e2e

        MONITOR_DEBUG: "1"

        ESHOP_USE_HTTP_ENDPOINTS: 1
        USERNAME1: bob
        PASSWORD: Pass123$
        DEBUG: pw:webserver*
      run: |
        set -euo pipefail
        mkdir -p artifacts/monitoring

        python3 ~/pipeline-monitor/ci_context_github.py \
          --output artifacts/monitoring/run_context-${{ matrix.runner }}.json

        export RUN_CONTEXT_PATH="artifacts/monitoring/run_context-${{ matrix.runner }}.json"

        cat > phases.json <<'JSON'
        [
          {"name": "npm-install",           "command": "npm ci"},
          {"name": "playwright-browsers",   "command": "npx playwright install chromium"},
          {"name": "playwright-tests",      "command": "npx playwright test"}
        ]
        JSON

        TRACE_OUT="artifacts/monitoring/trace-${{ matrix.runner }}.json"

        export LOG_PATH="artifacts/monitoring/monitor-${{ matrix.runner }}.log"
        export JSON_OUTPUT="artifacts/monitoring/monitor_metrics-${{ matrix.runner }}.json"
        export INTERVAL="1"

        ~/pipeline-monitor/run_with_monitoring.sh \
          "~/pipeline-monitor/.venv/bin/python ~/pipeline-monitor/traced_run.py --phases phases.json --output ${TRACE_OUT} --log-dir artifacts/monitoring/logs-${{ matrix.runner }}"

    - name: Upload monitoring artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: pipeline-monitor-${{ matrix.runner }}
        path: artifacts/monitoring/

  durations:
    name: Fetch job durations
    runs-on: ubuntu-latest
    needs: e2e-test
    if: always()
    permissions:
      actions: read
      contents: read

    steps:
      - name: Fetch job durations
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/monitoring

          curl -fsSL \
            https://raw.githubusercontent.com/garzon-it/microservices-testing-dashboard/monitoring/monitoring/ci_job_durations_github.py \
            -o ci_job_durations_github.py

          python3 ci_job_durations_github.py \
            --output artifacts/monitoring/job_durations.json

      - name: Download monitoring artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: pipeline-monitor-*
          path: artifacts/monitoring/
          merge-multiple: true

      - name: Build run records
        run: |
          set -euo pipefail
          curl -fsSL \
            https://raw.githubusercontent.com/garzon-it/microservices-testing-dashboard/monitoring/monitoring/build_run_record.py \
            -o build_run_record.py

          for runner in ubuntu-latest self-hosted; do
            mon="artifacts/monitoring/monitor_metrics-${runner}.json"
            if [ -f "$mon" ]; then
              TRACE_ARGS=""
              trace_file="artifacts/monitoring/trace-${runner}.json"
              if [ -f "$trace_file" ]; then
                TRACE_ARGS="--trace ${trace_file}"
              fi

              python3 build_run_record.py \
                --context "artifacts/monitoring/run_context-${runner}.json" \
                --monitor "$mon" \
                --durations artifacts/monitoring/job_durations.json \
                --job-name "e2e-test (${runner})" \
                $TRACE_ARGS \
                --output "artifacts/monitoring/run_record-${runner}.json"
            fi
          done

      - name: Prepare Loki logs
        run: |
          set -euo pipefail
          curl -fsSL \
            https://raw.githubusercontent.com/garzon-it/microservices-testing-dashboard/monitoring/monitoring/prepare_loki_logs.py \
            -o prepare_loki_logs.py

          for runner in ubuntu-latest self-hosted; do
            log_dir="artifacts/monitoring/logs-${runner}"
            record="artifacts/monitoring/run_record-${runner}.json"
            if [ -d "$log_dir" ] && [ -f "$record" ]; then
              python3 prepare_loki_logs.py \
                --log-dir "$log_dir" \
                --run-record "$record" \
                --output "artifacts/monitoring/loki-push-${runner}.json"
            fi
          done

      - name: Send run records to dashboard
        env:
          INGEST_URL: ${{ secrets.DASHBOARD_INGEST_URL }}
        run: |
          curl -fsSL https://raw.githubusercontent.com/garzon-it/microservices-testing-dashboard/monitoring/monitoring/send_to_dashboard.py \
            -o send_to_dashboard.py
          python3 send_to_dashboard.py artifacts/monitoring/run_record-*.json

      - name: Delete intermediate artifacts
        uses: geekyeggo/delete-artifact@v5
        with:
          name: pipeline-monitor-*

      - name: Upload pipeline results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pipeline-results
          path: |
            artifacts/monitoring/run_record-*.json
            artifacts/monitoring/loki-push-*.json