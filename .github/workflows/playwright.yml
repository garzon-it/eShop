name: Playwright Tests for eShop
on:
  push:
    branches: [ continuous_testing ]
    paths-ignore:
      - '**.md'
      - 'src/ClientApp/**'
      - 'tests/ClientApp.UnitTests/**'
      - '.github/workflows/pr-validation-maui.yml'
  pull_request:
    branches: [ continuous_testing ]
    paths-ignore:
      - '**.md'
      - 'src/ClientApp/**'
      - 'test/ClientApp.UnitTests/**'
      - '.github/workflows/pr-validation-maui.yml'

jobs:
  test:
    timeout-minutes: 60
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        runner: [self-hosted]  # Change to [ubuntu-latest] as needed
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        global-json-file: global.json
      env:
        DOTNET_INSTALL_DIR: ${{ runner.temp }}/.dotnet
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: lts/*
    
    - name: Add .NET to PATH
      run: |
        echo "${{ runner.temp }}/.dotnet" >> $GITHUB_PATH
        echo "${{ runner.temp }}/.dotnet/tools" >> $GITHUB_PATH
        echo "$HOME/.dotnet/tools" >> $GITHUB_PATH
    
    - name: Install npm dependencies
      run: npm ci
    
    - name: Install .NET HTTPS Development Certificate
      run: |
        dotnet tool update -g linux-dev-certs
        export PATH="$PATH:$HOME/.dotnet/tools"
        dotnet linux-dev-certs install
    
    - name: Install Playwright Browsers with system dependencies
      run: npx playwright install --with-deps chromium
    
    - name: Debug curl server
      run: |
        echo "Testing with curl..."
        curl -vk https://localhost:19888/ || true
    
    - name: Run Playwright tests
      run: npx playwright test
      env:
        ESHOP_USE_HTTP_ENDPOINTS: 1
        USERNAME1: bob
        PASSWORD: Pass123$
        DEBUG: pw:webserver*
    
    - name: Upload Playwright report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report-${{ matrix.runner }}
        path: playwright-report/
    
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: e2e-junit-${{ matrix.runner }}
        path: artifacts/test-results/e2e-results.xml