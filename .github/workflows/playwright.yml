name: Playwright Tests for eShop
on:
  push:
    branches: [ otel_test ]
    paths-ignore:
      - '**.md'
      - 'src/ClientApp/**'
      - 'tests/ClientApp.UnitTests/**'
      - '.github/workflows/pr-validation-maui.yml'
  pull_request:
    branches: [ otel_test ]
    paths-ignore:
      - '**.md'
      - 'src/ClientApp/**'
      - 'test/ClientApp.UnitTests/**'
      - '.github/workflows/pr-validation-maui.yml'
jobs:
  test:
    timeout-minutes: 60
    runs-on: ${{ matrix.runner }}
    env:
      CI_SERVICE_NAME: "cicd-pipeline"
      CI_JOB_TARGET: "eshop-e2e"
      OTLP_AUTH_TOKEN: ${{ secrets.OTLP_AUTH_TOKEN }}
    strategy:
      matrix:
        runner: [
          self-hosted, 
          ubuntu-latest
        ]
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-dotnet@v4
      with:
        global-json-file: global.json
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*

    - name: Setup Python (for ciwrap)
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'
        cache: 'pip'
        cache-dependency-path: ci-telemetry/requirements.txt

    - name: Install Python OTel dependencies
      run: pip install -r ci-telemetry/requirements.txt

    - name: Setup OTel
      run: bash ci-telemetry/ci-setup.sh

    - name: Install dependencies
      run: python3 ci-telemetry/ciwrap.py --name "Install dependencies" --process-metrics --process-include-children -- npm ci

    - name: Install .NET HTTPS Development Certificate
      run: |
        python3 ci-telemetry/ciwrap.py --name "Install .NET HTTPS Dev Certs - tool update" -- dotnet tool update -g linux-dev-certs
        python3 ci-telemetry/ciwrap.py --name "Install .NET HTTPS Dev Certs - install" -- dotnet linux-dev-certs install

    - name: Install Playwright Browsers
      run: python3 ci-telemetry/ciwrap.py --name "Install Playwright Browsers" --process-metrics -- npx playwright install chromium

    - name: Run Playwright tests
      run: python3 ci-telemetry/ciwrap.py --name "Run Playwright tests" --process-metrics --process-include-children --junit artifacts/test-results/results.xml -- npx playwright test
      env:
        ESHOP_USE_HTTP_ENDPOINTS: 1
        USERNAME1: bob
        PASSWORD: Pass123$

    - name: Teardown OTel
      if: always()
      run: bash ci-telemetry/ci-teardown.sh

    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report-${{ matrix.runner }}
        path: playwright-report/
        retention-days: 30

    # OTel OTLP-JSON (logs + metrics) + raw captured logs
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: otel-data-${{ matrix.runner }}
        path: |
          artifacts/otel/otel-logs.json
          artifacts/otel/otel-metrics.json
          artifacts/otel/otel-traces.json
          artifacts/step-logs/
          artifacts/otel/otelcol.log
          artifacts/test-results/
        retention-days: 30
